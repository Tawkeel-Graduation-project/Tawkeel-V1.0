[project]
name = "tawkeel-backend"
version = "0.1.0"
description = "Backend foundation for the Tawkeel project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.7.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
